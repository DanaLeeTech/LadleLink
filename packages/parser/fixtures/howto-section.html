<!doctype html>
<html>
<head>
  <title>Lemon Drizzle Cake</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Lemon Drizzle Cake",
    "recipeYield": "8 servings",
    "image": "https://example.com/images/lemon-cake.jpg",
    "recipeIngredient": ["200 g butter", "200 g caster sugar", "3 eggs", "200 g self-raising flour"],
    "recipeInstructions": [
      {
        "@type": "HowToSection",
        "name": "For the cake",
        "itemListElement": [
          { "@type": "HowToStep", "text": "Step 1. Cream the butter and sugar." },
          { "@type": "HowToStep", "text": "Beat in the eggs and fold in the flour." }
        ]
      },
      {
        "@type": "HowToSection",
        "name": "For the icing",
        "itemListElement": [
          { "@type": "HowToStep", "text": "2. Mix the lemon juice with icing sugar and drizzle over." }
        ]
      }
    ]
  }
  </script>
</head>
<body><h1>Lemon Drizzle Cake</h1></body>
</html>
