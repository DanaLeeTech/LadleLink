<!DOCTYPE html>
<html>
<head><title>Heuristic Cookies</title></head>
<body>
  <h1>Heuristic Cookies</h1>
  <p>Servings: 12</p>
  <h2>Ingredients</h2>
  <ul>
    <li>200 g butter</li>
    <li>1 cup sugar</li>
    <li>2 cups flour</li>
  </ul>
  <h2>Instructions</h2>
  <ol>
    <li>Cream butter and sugar.</li>
    <li>Mix in flour and bake.</li>
  </ol>
</body>
</html>
