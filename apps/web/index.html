<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LadleLink</title>
    <meta
      name="description"
      content="LadleLink is a self-hosted, local-first recipe manager. Scale portions, convert cups ⇄ grams ⇄ ml with density-aware units, and import recipes from a URL. Runs in one Docker container; your recipes stay on your machine."
    />
    <meta property="og:title" content="LadleLink — self-hosted recipe manager" />
    <meta
      property="og:description"
      content="Scale portions, convert cups ⇄ grams ⇄ ml, and import any recipe from a URL. Self-host with Docker; your recipes stay on your machine."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ladlelink-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
